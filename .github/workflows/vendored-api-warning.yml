# Fails when vendored upstream API snapshots change without a matching
# update to vendored-api.sha256. Updating the checksum is the deliberate
# step that marks the change as intentional.

name: Vendored API checksum

on:
  pull_request:
    paths:
      - src/main/java/mods/railcraft/api/**
      - src/main/java/cofh/api/**
      - src/main/java/dan200/computercraft/api/**
      - vendored-api.sha256
      - scripts/check-vendored-api.sh

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify vendored API checksums
        run: scripts/check-vendored-api.sh
